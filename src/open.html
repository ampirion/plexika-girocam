<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plexika · Открыть 3D HTML</title><style>body{margin:0;background:#0b202b;color:#ebf7fb;font:17px system-ui;min-height:100dvh;display:grid;place-content:center;padding:24px}main{max-width:460px}h1{font-size:25px}p{color:#b6cdd5;line-height:1.5}label{display:block;padding:18px;border:1px solid #82bea7;border-radius:12px;background:#21473e;font-weight:700;cursor:pointer;text-align:center}input{display:block;width:100%;margin-top:12px}#status{color:#ffca98}</style><main><h1>Открыть 3D HTML</h1><p>Выберите экспортированный файл Plexika. Он откроется здесь с HTTPS-доступом к датчикам.</p><label>Выбрать HTML на устройстве<input id="file" type="file" accept=".html,.htm,text/html"></label><p>Файл читается только на вашем устройстве — не загружается на сервер. QR и компьютер не нужны.</p><p id="status" role="status"></p></main><script>document.getElementById('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;const note=document.getElementById('status');try{if(f.size>96*1024*1024)throw Error('Файл больше 96 МБ');const html=await f.text();if(!html.includes('installGyro334')||!html.includes('PlexikaLite.mount'))throw Error('Выберите автономный 3D HTML Plexika V13.35 или новее');window.stop();document.open();document.write(html);document.close();}catch(err){note.textContent=err.message;}};</script></html>
